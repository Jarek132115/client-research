<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KONARSTUDIO · Prospect Command</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  /* type scale */
  --t-xs:12px; --t-sm:14px; --t-md:16px; --t-lg:20px; --t-xl:28px; --t-2xl:36px;
  /* spacing (4 / 8) */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px; --s12:48px;
  /* surfaces */
  --bg:#f7f8fa; --panel:#ffffff; --panel-2:#fbfcfd; --panel-3:#f3f5f8;
  --fg:#0c0e13; --muted:#5c6470; --faint:#959ba6;
  --border:#e9ebef; --border-2:#dfe2e8;
  /* accent (used sparingly) */
  --accent:#2563eb; --accent-h:#1d4ed8; --accent-soft:#eef3ff; --accent-bd:#d6e2ff;
  /* semantic */
  --green:#0f9b63; --green-bg:#e6f6ee;
  --amber:#b9760f; --amber-bg:#fbf0db;
  --red:#d24339; --red-bg:#fbeae8;
  --violet:#6b46d9; --violet-bg:#eee9fc;
  --grey:#5b6472; --grey-bg:#eef0f3;
  /* radii + shadow */
  --r-lg:16px; --r-md:12px; --r-sm:9px; --r-xs:7px;
  --sh:0 1px 2px rgba(12,14,19,.04),0 1px 3px rgba(12,14,19,.06);
  --sh-lg:0 24px 60px -18px rgba(12,14,19,.28);
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--fg);font-size:var(--t-sm);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--accent-soft)}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hide-sm{display:inline}

/* ---------- App bar ---------- */
.appbar{position:sticky;top:0;z-index:30;background:rgba(247,248,250,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:var(--s4);padding:var(--s3) var(--s6)}
.brand{display:flex;align-items:center;gap:var(--s3)}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,#2563eb,#4f8bff);display:grid;place-items:center;box-shadow:0 4px 12px -3px rgba(37,99,235,.5);flex:0 0 34px}
.brand-mark svg{width:18px;height:18px}
.brand-name{font-weight:800;font-size:var(--t-md);letter-spacing:-.02em;line-height:1.05}
.brand-sub{font-size:var(--t-xs);color:var(--faint);font-weight:600;letter-spacing:.01em}
.appbar-spacer{flex:1}
.live{display:inline-flex;align-items:center;gap:var(--s2);font-size:var(--t-xs);color:var(--muted);font-weight:600;white-space:nowrap}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-bg)}
.live-dot.is-seed{background:var(--amber);box-shadow:0 0 0 3px var(--amber-bg)}
.live-dot.is-err{background:var(--red);box-shadow:0 0 0 3px var(--red-bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);font-size:var(--t-sm);font-weight:600;padding:9px 14px;border-radius:var(--r-sm);border:1px solid var(--border-2);background:var(--panel);transition:background .12s,border-color .12s,opacity .12s;min-height:40px}
.btn:hover{background:var(--panel-2)}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-h)}

/* ---------- Layout ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:var(--s6) var(--s6) var(--s12);width:100%}
.hero{margin-bottom:var(--s6)}
.hero-title{font-size:var(--t-xl);font-weight:800;letter-spacing:-.025em;line-height:1.1}
.hero-sub{font-size:var(--t-sm);color:var(--muted);margin-top:var(--s2);max-width:62ch}

/* ---------- KPI strip ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--s3);margin-bottom:var(--s6)}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s4) var(--s5);box-shadow:var(--sh)}
.kpi-label{font-size:var(--t-xs);font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kpi-value{font-family:var(--mono);font-size:var(--t-xl);font-weight:600;letter-spacing:-.02em;line-height:1.05;margin-top:var(--s3)}
.kpi-value small{font-size:var(--t-md);color:var(--faint)}
.kpi-sub{font-size:var(--t-xs);color:var(--muted);margin-top:var(--s2);font-weight:500}
.kpi-sub b{color:var(--fg);font-weight:700}

/* ---------- Toolbar ---------- */
.toolbar{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s4)}
.chips{display:flex;gap:var(--s2);flex-wrap:wrap}
.chip{font-size:var(--t-sm);font-weight:600;padding:8px 13px;border-radius:99px;border:1px solid var(--border-2);color:var(--muted);background:var(--panel);transition:all .12s;display:inline-flex;align-items:center;gap:var(--s2);min-height:38px}
.chip:hover{background:var(--panel-2);color:var(--fg)}
.chip.on{background:var(--fg);color:#fff;border-color:var(--fg)}
.chip .cc{font-family:var(--mono);font-size:11px;opacity:.65}
.chip.on .cc{opacity:.85}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:12px;width:16px;height:16px;color:var(--faint);pointer-events:none}
.search input{font-family:inherit;font-size:var(--t-sm);width:240px;max-width:60vw;padding:10px 14px 10px 36px;border:1px solid var(--border-2);border-radius:var(--r-sm);background:var(--panel);color:var(--fg);transition:border-color .15s,box-shadow .15s;min-height:40px}
.search input:focus{outline:none;border-color:var(--accent-bd);box-shadow:0 0 0 3px var(--accent-soft)}
.search input::placeholder{color:var(--faint)}
.sortctl{display:inline-flex;border:1px solid var(--border-2);border-radius:var(--r-sm);overflow:hidden;background:var(--panel)}
.sortbtn{font-size:var(--t-sm);font-weight:600;color:var(--muted);padding:9px 13px;min-height:40px;display:inline-flex;align-items:center;gap:5px;transition:background .12s,color .12s}
.sortbtn+.sortbtn{border-left:1px solid var(--border-2)}
.sortbtn:hover{background:var(--panel-2);color:var(--fg)}
.sortbtn.on{background:var(--accent-soft);color:var(--accent)}
.sortbtn .ar{font-size:9px}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:var(--t-xs);font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;letter-spacing:.005em}
.badge .dot{width:6px;height:6px;border-radius:50%}
.b-blue{background:var(--accent-soft);color:var(--accent)} .b-blue .dot{background:var(--accent)}
.b-green{background:var(--green-bg);color:var(--green)} .b-green .dot{background:var(--green)}
.b-amber{background:var(--amber-bg);color:var(--amber)} .b-amber .dot{background:var(--amber)}
.b-red{background:var(--red-bg);color:var(--red)} .b-red .dot{background:var(--red)}
.b-violet{background:var(--violet-bg);color:var(--violet)} .b-violet .dot{background:var(--violet)}
.b-grey{background:var(--grey-bg);color:var(--grey)} .b-grey .dot{background:var(--grey)}
.tag{font-size:var(--t-xs);font-weight:600;color:var(--muted);background:var(--panel-3);border:1px solid var(--border);padding:3px 9px;border-radius:6px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle}

/* ---------- Table ---------- */
.table-wrap{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{font-size:var(--t-xs);font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);text-align:left;padding:12px var(--s5);border-bottom:1px solid var(--border);background:var(--panel-2);white-space:nowrap;user-select:none}
thead th.sortable{cursor:pointer}
thead th.sortable:hover{color:var(--muted)}
thead th .ar{opacity:.55;font-size:9px}
tbody tr{border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--accent-soft)}
tbody td{padding:14px var(--s5);vertical-align:middle}
.cs-name{font-weight:700;font-size:var(--t-sm);letter-spacing:-.01em}
.cs-dom{font-family:var(--mono);font-size:11px;color:var(--faint);display:block;margin-top:1px}
.fit{display:inline-flex;align-items:baseline;gap:2px;font-family:var(--mono);font-weight:600}
.fit b{font-size:var(--t-md)}
.fit .mx{font-size:11px;color:var(--faint)}

/* ---------- Skeleton / states ---------- */
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.sk{background:linear-gradient(90deg,#eef0f3 25%,#f6f7f9 50%,#eef0f3 75%);background-size:800px 100%;animation:shimmer 1.3s infinite linear;border-radius:6px}
.sk-line{height:12px;margin:6px 0}
.kpi .sk-line{height:28px;margin-top:var(--s3)}
.state-card{padding:var(--s12) var(--s6);text-align:center}
.state-icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;margin:0 auto var(--s4);background:var(--panel-3);color:var(--muted)}
.state-icon svg{width:24px;height:24px}
.state-icon.err{background:var(--red-bg);color:var(--red)}
.state-title{font-size:var(--t-md);font-weight:700}
.state-sub{font-size:var(--t-sm);color:var(--muted);margin:var(--s2) auto 0;max-width:42ch}
.state-card .btn{margin-top:var(--s5)}

/* ---------- Drawer ---------- */
.overlay{position:fixed;inset:0;background:rgba(12,14,19,.34);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.overlay.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;height:100dvh;width:480px;max-width:100vw;background:var(--panel);box-shadow:var(--sh-lg);transform:translateX(100%);transition:transform .3s cubic-bezier(.32,.72,.3,1);z-index:50;display:flex;flex-direction:column}
.drawer.show{transform:translateX(0)}
.dr-head{padding:var(--s5) var(--s6) var(--s4);border-bottom:1px solid var(--border);position:relative}
.dr-close{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:9px;display:grid;place-items:center;color:var(--muted);transition:background .12s}
.dr-close:hover{background:var(--panel-3);color:var(--fg)}
.dr-close svg{width:18px;height:18px}
.dr-eyebrow{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s3);padding-right:44px}
.dr-title{font-size:var(--t-lg);font-weight:800;letter-spacing:-.02em;line-height:1.15}
.dr-domain{font-family:var(--mono);font-size:var(--t-xs);color:var(--accent);margin-top:var(--s1);display:inline-flex;align-items:center;gap:5px}
.dr-chips{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s4)}
.dr-body{overflow-y:auto;padding:0 var(--s6) var(--s10);flex:1;-webkit-overflow-scrolling:touch}
.sec{padding:var(--s5) 0;border-bottom:1px solid var(--border)}
.sec:last-child{border-bottom:none}
.sec-title{font-size:var(--t-xs);font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-bottom:var(--s3);display:flex;align-items:center;gap:var(--s2)}
.sec-title .ct{font-family:var(--mono);background:var(--panel-3);border:1px solid var(--border);border-radius:6px;padding:1px 6px;font-size:10px;color:var(--muted)}
.leak{font-size:var(--t-md);font-weight:600;line-height:1.5;letter-spacing:-.01em}
.kv{display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s3)}
.kv .est{font-family:var(--mono);font-size:var(--t-md);font-weight:600}
.signal{display:flex;gap:var(--s3);padding:var(--s3) 0;border-top:1px dashed var(--border)}
.signal:first-of-type{border-top:none}
.signal .m{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:3px 8px;height:fit-content;white-space:nowrap;flex:0 0 auto}
.signal .d{font-size:var(--t-sm);color:var(--muted);line-height:1.55}
.signal .d .src{display:block;color:var(--faint);font-size:11px;margin-top:2px}
.wk{display:flex;gap:var(--s3);padding:var(--s3) 0;border-top:1px solid var(--border)}
.wk:first-of-type{border-top:none}
.wk-sev{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:0 0 9px}
.sev-high{background:var(--red)} .sev-med{background:var(--amber)} .sev-low{background:var(--grey)}
.wk-top{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin-bottom:3px}
.wk-issue{font-size:var(--t-sm);font-weight:600;line-height:1.45}
.wk-why{font-size:var(--t-sm);color:var(--muted);line-height:1.55}
.demo-head{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s3);flex-wrap:wrap}
.demo-rat{font-size:var(--t-sm);color:var(--muted);line-height:1.55;margin-bottom:var(--s3)}
.mech{display:flex;gap:var(--s3);padding:6px 0;font-size:var(--t-sm);line-height:1.55}
.mech .n{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--accent);flex:0 0 auto;margin-top:1px}
.panel-note{background:var(--violet-bg);border:1px solid #ddd2f6;border-left:3px solid var(--violet);border-radius:var(--r-sm);padding:var(--s3) var(--s4);font-size:var(--t-sm);line-height:1.6;color:#43308f}
.caveat{background:var(--amber-bg);border:1px solid #efdcb4;border-radius:var(--r-sm);padding:var(--s3) var(--s4);font-size:var(--t-sm);line-height:1.6;color:#7c5410}
.caveat .cv-l{font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:.06em;margin-bottom:var(--s2);display:flex;align-items:center;gap:var(--s2)}
.todo{display:flex;gap:var(--s3);padding:7px 0;font-size:var(--t-sm);line-height:1.55;align-items:flex-start;cursor:pointer}
.todo input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent);flex:0 0 16px}
.contact-card{display:flex;align-items:center;gap:var(--s3);background:var(--panel-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:var(--s4)}
.avatar{width:44px;height:44px;border-radius:12px;background:linear-gradient(145deg,#2563eb,#5b8dff);color:#fff;display:grid;place-items:center;font-weight:700;font-size:var(--t-md);flex:0 0 44px}
.ct-name{font-weight:700;font-size:var(--t-sm)}
.ct-role{font-size:var(--t-xs);color:var(--muted)}
.ct-email{font-family:var(--mono);font-size:11.5px;color:var(--accent);margin-top:3px;display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;word-break:break-all}
.ct-links{margin-left:auto;display:flex;flex-direction:column;gap:var(--s2);align-items:flex-end;flex:0 0 auto}
.mini{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-bd);padding:6px 10px;border-radius:7px;display:inline-flex;align-items:center;gap:5px;min-height:34px}
.mini:hover{background:#e3edff}
.mini svg{width:13px;height:13px}

/* ---------- Email drafts (the centerpiece) ---------- */
.email-card{border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;margin-bottom:var(--s4);background:var(--panel)}
.email-card:last-child{margin-bottom:0}
.email-head{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4);background:var(--panel-2);border-bottom:1px solid var(--border);flex-wrap:wrap}
.email-actions{margin-left:auto;display:flex;gap:var(--s2)}
.email-subject{padding:var(--s4) var(--s4) var(--s2);font-weight:700;font-size:var(--t-md);letter-spacing:-.01em;line-height:1.35}
.email-subject .sl{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-bottom:3px}
.email-body{padding:var(--s2) var(--s4) var(--s5);font-size:var(--t-sm);line-height:1.6;color:#2b313d;white-space:pre-wrap;word-break:break-word;max-width:60ch}
.ph{background:var(--amber-bg);color:#9a6406;font-weight:600;border-radius:5px;padding:0 5px;border:1px solid #efdcb4;font-size:.93em}

/* ---------- Toast ---------- */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--fg);color:#fff;font-size:var(--t-sm);font-weight:600;padding:11px 18px;border-radius:11px;box-shadow:var(--sh-lg);opacity:0;pointer-events:none;transition:all .25s;z-index:80;display:flex;align-items:center;gap:var(--s2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:16px;height:16px;color:#5dd29b}

/* ---------- Responsive: table -> cards ---------- */
@media(max-width:768px){
  .appbar{padding:var(--s3) var(--s4)}
  .brand-sub{display:none}
  .hide-sm{display:none}
  .wrap{padding:var(--s5) var(--s4) var(--s12)}
  .hero-title{font-size:var(--t-lg)}
  .tb-right{width:100%;margin-left:0}
  .search{flex:1}
  .search input{width:100%;max-width:none}
  .table-wrap{background:transparent;border:none;box-shadow:none;overflow:visible}
  thead{display:none}
  table,tbody{display:block}
  tbody tr{display:block;border:1px solid var(--border);border-radius:var(--r-md);background:var(--panel);box-shadow:var(--sh);padding:var(--s4);margin-bottom:var(--s3);min-height:44px}
  tbody tr:hover{background:var(--panel)}
  tbody td{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:7px 0;border:none}
  tbody td.td-store{display:block;padding:0 0 var(--s3);margin-bottom:var(--s2);border-bottom:1px solid var(--border)}
  tbody td:not(.td-store)::before{content:attr(data-label);font-size:var(--t-xs);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .cs-name{font-size:var(--t-md)}
  .drawer{width:100vw;max-width:100vw}
  .dr-head{padding:var(--s5) var(--s5) var(--s4)}
  .dr-body{padding:0 var(--s5) var(--s10)}
  .email-body{max-width:none}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<header class="appbar">
  <div class="brand">
    <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M5 19V5l7 7 7-7v14" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div><div class="brand-name">KONARSTUDIO</div><div class="brand-sub">Prospect Command</div></div>
  </div>
  <div class="appbar-spacer"></div>
  <span class="live"><span class="live-dot" id="liveDot"></span><span id="liveTxt">Loading…</span></span>
  <button class="btn" id="refreshBtn" aria-label="Refresh data"><svg viewBox="0 0 24 24" fill="none"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v4h-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="hide-sm">Refresh</span></button>
</header>

<main class="wrap">
  <div class="hero">
    <h1 class="hero-title">Prospect Command</h1>
    <p class="hero-sub">Researched Shopify stores — scored, drafted, and ready for your review. Tap any prospect for the full teardown and cold-email drafts.</p>
  </div>

  <section class="kpis" id="kpis"></section>

  <div class="toolbar">
    <div class="chips" id="chips"></div>
    <div class="tb-right">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m20 20-3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="search" placeholder="Search store, domain, vertical…" aria-label="Search prospects" />
      </div>
      <div class="sortctl" role="group" aria-label="Sort">
        <button class="sortbtn on" data-sort="fit">Fit <span class="ar" data-ar="fit">▼</span></button>
        <button class="sortbtn" data-sort="priority">Priority <span class="ar" data-ar="priority"></span></button>
      </div>
    </div>
  </div>

  <section class="table-wrap">
    <table>
      <thead><tr>
        <th class="sortable" data-sort="store">Store <span class="ar"></span></th>
        <th>Vertical</th>
        <th class="sortable" data-sort="fit">Fit <span class="ar" data-ar2="fit"></span></th>
        <th class="sortable" data-sort="priority">Priority <span class="ar" data-ar2="priority"></span></th>
        <th>Status</th>
        <th>Email</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </section>
</main>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Prospect detail" role="dialog" aria-modal="true"></aside>
<div class="toast" id="toast"><svg viewBox="0 0 24 24" fill="none"><path d="m5 13 4 4L19 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="toastMsg">Copied</span></div>

<script>
"use strict";
var API = "https://konarstudio.app.n8n.cloud/webhook/prospects-feed-k2x9";

var $  = function(s,r){ return (r||document).querySelector(s); };
var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function num(v){ var n=parseFloat(v); return isFinite(n)?n:0; }
function cap(s){ return s? s.charAt(0).toUpperCase()+s.slice(1) : s; }

/* ---------- state ---------- */
var RAW = [];
var STATE = 'loading';           // loading | ready | empty | error
var filter = 'all';
var sortKey = 'fit', sortDir = -1;
var search = '';
var drawerData = null, draftIdx = 0;

/* ---------- defensive field mapping (flat first, then nested) ---------- */
function norm(p){
  var r=p.research||{}, c=p.contact||{}, o=p.outreach||{};
  var drafts = (o.drafts && o.drafts.length) ? o.drafts
            : (p.draftBody || p.draftSubject) ? [{variant:'draft', channel:'email', subject:p.draftSubject, body:p.draftBody}] : [];
  var emailStatus = c.emailStatus || p.emailStatus || '';
  var emailVerified = c.emailVerified===true || emailStatus==='verified';
  return {
    storeName: p.storeName || p.title || 'Untitled',
    domain: p.domain || '',
    vertical: p.vertical || '',
    status: p.status || 'researched',
    priority: p.priority || '',
    track: p.track || '',
    disqualified: p.disqualified===true || p.status==='disqualified',
    disqualifyReason: p.disqualifyReason || '',
    shopifyConfirmed: p.shopifyConfirmed===true || !!p.shopifySignal,
    shopifySignal: p.shopifySignal || '',
    fitScore: num(p.fitScore!=null ? p.fitScore : r.fitScore),
    scores: p.scores || r.scores || {},
    revenueEstimate: p.revenueEstimate || r.revenueEstimate || '',
    revenueConfidence: p.revenueConfidence || r.revenueConfidence || '',
    revenueSignals: p.revenueSignals || r.revenueSignals || [],
    leakHypothesis: p.leakHypothesis || r.leakHypothesis || '',
    weaknesses: p.weaknesses || r.weaknesses || [],
    demo: p.demo || r.demo || null,
    scrutiny: p.scrutiny || r.scrutiny || '',
    panelNotes: r.panelNotes || p.panelNotes || '',
    contact: { name:c.name||p.contactName||'', title:c.title||p.contactTitle||'', email:c.email||p.contactEmail||'', emailStatus:emailStatus, emailVerified:emailVerified, linkedin:c.linkedin||'' },
    drafts: drafts,
    operatorTodo: p.operatorTodo || r.operatorTodo || [],
    caveats: p.caveats || r.caveats || ''
  };
}

/* ---------- badges ---------- */
var STATUS_BADGE = {researched:['b-grey','Researched'],drafted:['b-blue','Drafted'],no_email:['b-amber','Needs email'],approved:['b-green','Approved'],sent:['b-violet','Sent'],replied:['b-green','Replied'],disqualified:['b-red','Disqualified']};
var PRIORITY_BADGE = {top:['b-green','Top'],solid:['b-blue','Solid'],hold:['b-amber','Hold'],skip:['b-grey','Skip']};
function badge(cls,label){ return '<span class="badge '+cls+'"><span class="dot"></span>'+esc(label)+'</span>'; }
function statusBadge(s){ var m=STATUS_BADGE[s]||['b-grey', cap(s)||'—']; return badge(m[0],m[1]); }
function priorityBadge(p,disq){ if(disq && !PRIORITY_BADGE[p]) return badge('b-red','Disqualified'); var m=PRIORITY_BADGE[p]||['b-grey', cap(p)||'—']; return badge(m[0],m[1]); }
function emailBadge(c){
  if(!c.email) return badge('b-amber','no email');
  if(c.emailVerified) return badge('b-green','verified');
  if(c.emailStatus==='pattern-guess') return badge('b-amber','pattern-guess · unverified');
  return badge('b-grey', c.emailStatus ? c.emailStatus : 'unverified');
}
function fitColor(n){ return n>=15?'var(--green)':n>=12?'var(--accent)':n>=9?'var(--amber)':'var(--grey)'; }
function variantLabel(v){ var m={'warm-human':'Warm-human','teardown':'Teardown','demo-first':'Demo-first','value-first':'Value-first','follow-up':'Follow-up','standard':'Standard'}; return m[v] || (v? v.split('-').map(cap).join(' ') : 'Draft'); }

/* ---------- filters + sort ---------- */
var FILTERS = {
  all: function(){ return true; },
  top: function(p){ return p.priority==='top'; },
  solid: function(p){ return p.priority==='solid'; },
  hold: function(p){ return p.priority==='hold'; },
  drafted: function(p){ return p.status==='drafted'; },
  no_email: function(p){ return p.status==='no_email'; },
  disqualified: function(p){ return p.disqualified; }
};
function count(fn){ var n=0; for(var i=0;i<RAW.length;i++){ if(fn(RAW[i])) n++; } return n; }
var PRANK = {top:0,solid:1,hold:2,skip:3,disqualified:4};
function visible(){
  var list = RAW.filter(FILTERS[filter] || FILTERS.all);
  if(search){ var q=search.toLowerCase(); list = list.filter(function(p){ return (p.storeName+' '+p.domain+' '+p.vertical).toLowerCase().indexOf(q)>=0; }); }
  list = list.slice().sort(function(a,b){
    if(sortKey==='store'){ var av=a.storeName.toLowerCase(), bv=b.storeName.toLowerCase(); return av<bv?-sortDir:av>bv?sortDir:0; }
    if(sortKey==='priority'){ var ra=(PRANK[a.priority]!=null?PRANK[a.priority]:9), rb=(PRANK[b.priority]!=null?PRANK[b.priority]:9); return (ra-rb)*sortDir || (b.fitScore-a.fitScore); }
    return (a.fitScore-b.fitScore)*sortDir;
  });
  return list;
}

/* ---------- KPI ---------- */
function renderKPIs(){
  var qualified = count(function(p){ return !p.disqualified; });
  var fits = RAW.filter(function(p){ return !p.disqualified && p.fitScore>0; }).map(function(p){ return p.fitScore; });
  var avg = fits.length ? (fits.reduce(function(a,b){return a+b;},0)/fits.length) : 0;
  var cards = [
    ['Total prospects', RAW.length, '<b>'+qualified+'</b> qualified'],
    ['Top priority', count(FILTERS.top), 'ready to send'],
    ['Solid', count(FILTERS.solid), 'in pipeline'],
    ['Hold', count(FILTERS.hold), 'needs a second look'],
    ['Drafted', count(FILTERS.drafted), 'awaiting review'],
    ['Avg fit score', avg.toFixed(1)+'<small> /20</small>', 'across qualified']
  ];
  $('#kpis').innerHTML = cards.map(function(c){
    return '<div class="kpi"><div class="kpi-label">'+c[0]+'</div><div class="kpi-value">'+c[1]+'</div><div class="kpi-sub">'+c[2]+'</div></div>';
  }).join('');
}
function skeletonKPIs(){
  var out=''; for(var i=0;i<6;i++){ out+='<div class="kpi"><div class="kpi-label sk sk-line" style="width:60%"></div><div class="kpi-value"><div class="sk sk-line" style="width:50%"></div></div><div class="kpi-sub sk sk-line" style="width:70%;height:10px"></div></div>'; }
  $('#kpis').innerHTML = out;
}

/* ---------- chips + sort UI ---------- */
function renderChips(){
  var defs=[['all','All',RAW.length],['top','Top',count(FILTERS.top)],['solid','Solid',count(FILTERS.solid)],['hold','Hold',count(FILTERS.hold)],['drafted','Drafted',count(FILTERS.drafted)],['no_email','Needs email',count(FILTERS.no_email)],['disqualified','Disqualified',count(FILTERS.disqualified)]];
  $('#chips').innerHTML = defs.map(function(d){ return '<button class="chip '+(filter===d[0]?'on':'')+'" data-chip="'+d[0]+'">'+d[1]+'<span class="cc">'+d[2]+'</span></button>'; }).join('');
}
function syncSortUI(){
  $$('.sortbtn').forEach(function(b){ b.classList.toggle('on', b.dataset.sort===sortKey); });
  $$('[data-ar]').forEach(function(a){ a.textContent = a.getAttribute('data-ar')===sortKey ? (sortDir>0?'▲':'▼') : ''; });
  $$('[data-ar2]').forEach(function(a){ a.textContent = a.getAttribute('data-ar2')===sortKey ? (sortDir>0?'▲':'▼') : ''; });
}

/* ---------- table ---------- */
function renderTable(){
  var list=visible(), tb=$('#tbody');
  if(!list.length){
    tb.innerHTML = '<tr><td class="td-store"><div class="state-card"><div class="state-icon"><svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m20 20-3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div><div class="state-title">Nothing matches</div><div class="state-sub">No prospects fit this filter'+(search?' and search':'')+'. Try clearing it.</div></div></td></tr>';
    return;
  }
  tb.innerHTML = list.map(function(p){
    var idx=RAW.indexOf(p);
    return '<tr data-i="'+idx+'" tabindex="0" role="button" aria-label="Open '+esc(p.storeName)+'">'+
      '<td class="td-store"><span class="cs-name">'+esc(p.storeName)+'</span><span class="cs-dom mono">'+esc(p.domain||'—')+'</span></td>'+
      '<td data-label="Vertical"><span class="tag" title="'+esc(p.vertical)+'">'+esc(p.vertical||'—')+'</span></td>'+
      '<td data-label="Fit"><span class="fit" style="color:'+fitColor(p.fitScore)+'"><b>'+(p.fitScore||'—')+'</b><span class="mx">/20</span></span></td>'+
      '<td data-label="Priority">'+priorityBadge(p.priority,p.disqualified)+'</td>'+
      '<td data-label="Status">'+statusBadge(p.status)+'</td>'+
      '<td data-label="Email">'+emailBadge(p.contact)+'</td>'+
    '</tr>';
  }).join('');
}

/* ---------- top-level render ---------- */
function render(){
  if(STATE==='loading'){ skeletonKPIs(); $('#chips').innerHTML=''; $('#tbody').innerHTML='<tr><td class="td-store"><div class="sk sk-line" style="width:40%;height:16px"></div><div class="sk sk-line" style="width:80%"></div><div class="sk sk-line" style="width:70%"></div><div class="sk sk-line" style="width:75%"></div></td></tr>'; return; }
  if(STATE==='error'){ $('#kpis').innerHTML=''; $('#chips').innerHTML=''; $('#tbody').innerHTML='<tr><td class="td-store"><div class="state-card"><div class="state-icon err"><svg viewBox="0 0 24 24" fill="none"><path d="M12 8v5M12 16.5v.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/></svg></div><div class="state-title">Couldn&rsquo;t reach the feed</div><div class="state-sub">The Prospects API didn&rsquo;t respond. Check the connection and try again.</div><button class="btn btn-primary" id="retryBtn">Retry</button></div></td></tr>';
    var rb=$('#retryBtn'); if(rb) rb.addEventListener('click', load); return; }
  if(STATE==='empty'){ renderKPIs(); renderChips(); $('#tbody').innerHTML='<tr><td class="td-store"><div class="state-card"><div class="state-icon"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="15" rx="2" stroke="currentColor" stroke-width="2"/><path d="M9 3v4M15 3v4M4 10h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div><div class="state-title">No prospects yet</div><div class="state-sub">The routine hasn&rsquo;t published any prospects today. They&rsquo;ll appear here automatically once it runs.</div></div></td></tr>'; return; }
  renderKPIs(); renderChips(); syncSortUI(); renderTable();
}

/* ---------- drawer ---------- */
function initials(name){ return (name||'?').split(/\s+/).slice(0,2).map(function(w){return w[0]||'';}).join('').toUpperCase()||'?'; }
function highlightPH(escaped){ return escaped.replace(/\[[^\]\n]{1,40}\]/g, function(m){ return '<span class="ph">'+m+'</span>'; }); }
function emailCard(d,i){
  var subj = d.subject||'(no subject)';
  var body = d.body||'';
  return '<div class="email-card">'+
    '<div class="email-head"><span class="badge b-violet"><span class="dot"></span>'+esc(variantLabel(d.variant))+'</span>'+(d.channel?'<span class="tag">'+esc(d.channel)+'</span>':'')+
      '<div class="email-actions"><button class="mini" data-copysubj="'+i+'">Copy subject</button><button class="mini" data-copymail="'+i+'"><svg viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" stroke-width="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10" stroke="currentColor" stroke-width="2"/></svg>Copy email</button></div></div>'+
    '<div class="email-subject"><span class="sl">Subject</span>'+esc(subj)+'</div>'+
    '<div class="email-body">'+highlightPH(esc(body))+'</div>'+
  '</div>';
}
function openDrawer(p){
  drawerData=p; draftIdx=0;
  var c=p.contact, dr=$('#drawer');
  var shopify = p.shopifyConfirmed ? badge('b-green','Shopify confirmed') : '';
  var track = p.track ? badge('b-violet', cap(p.track)+' track') : '';
  var conf = p.revenueConfidence ? badge(p.revenueConfidence==='high'?'b-green':(p.revenueConfidence==='medium'||p.revenueConfidence==='med')?'b-amber':'b-grey', p.revenueConfidence+'-confidence') : '';

  var signals = (p.revenueSignals||[]).map(function(s){ return '<div class="signal"><span class="m">'+esc(s.method||'signal')+'</span><span class="d">'+esc(s.detail||'')+(s.source?'<span class="src">'+esc(s.source)+'</span>':'')+'</span></div>'; }).join('');
  var weaknesses = (p.weaknesses||[]).map(function(w){ var sev=(w.severity||'low').toLowerCase(); return '<div class="wk"><span class="wk-sev sev-'+esc(sev)+'"></span><div style="flex:1"><div class="wk-top"><span class="wk-issue">'+esc(w.issue||'')+'</span>'+(w.area?'<span class="tag">'+esc(w.area)+'</span>':'')+'<span class="badge '+(sev==='high'?'b-red':sev==='med'?'b-amber':'b-grey')+'"><span class="dot"></span>'+esc(sev)+'</span></div>'+(w.why?'<div class="wk-why">'+esc(w.why)+'</div>':'')+'</div></div>'; }).join('');
  var demo = '';
  if(p.demo){ var mech=(p.demo.mechanics||[]).map(function(m,i){ var n=String(i+1); if(n.length<2)n='0'+n; return '<div class="mech"><span class="n">'+n+'</span><span>'+esc(m)+'</span></div>'; }).join('');
    demo = '<div class="demo-head">'+(p.demo.primaryPage?badge('b-blue', String(p.demo.primaryPage).toUpperCase()):'')+(p.demo.bestseller?'<span class="tag">'+esc(p.demo.bestseller)+'</span>':'')+'</div>'+(p.demo.rationale?'<div class="demo-rat">'+esc(p.demo.rationale)+'</div>':'')+mech;
  }
  var drafts = (p.drafts||[]).map(emailCard).join('');
  var todos = (p.operatorTodo||[]).map(function(t){ return '<label class="todo"><input type="checkbox">'+esc(t)+'</label>'; }).join('');

  dr.innerHTML =
    '<div class="dr-head"><button class="dr-close" id="drClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>'+
      '<div class="dr-eyebrow">'+priorityBadge(p.priority,p.disqualified)+statusBadge(p.status)+track+'</div>'+
      '<div class="dr-title">'+esc(p.storeName)+'</div>'+
      (p.domain?'<a class="dr-domain" href="https://'+esc(p.domain)+'" target="_blank" rel="noopener">'+esc(p.domain)+' ↗</a>':'')+
      '<div class="dr-chips">'+shopify+badge('b-grey','Fit '+(p.fitScore||'—')+'/20')+(p.vertical?'<span class="tag">'+esc(p.vertical)+'</span>':'')+'</div>'+
    '</div>'+
    '<div class="dr-body">'+
      (p.leakHypothesis?'<div class="sec"><div class="sec-title">The problem</div><div class="leak">'+esc(p.leakHypothesis)+'</div></div>':'')+
      ((p.revenueEstimate||signals)?'<div class="sec"><div class="sec-title">Research · revenue</div><div class="kv"><span class="est">'+esc(p.revenueEstimate||'—')+'</span>'+conf+'</div>'+(p.revenueConfidence?'<div class="wk-why" style="margin-bottom:8px">Treat as a directional estimate &mdash; '+esc(p.revenueConfidence)+'-confidence, triangulated, not filed accounts.</div>':'')+signals+'</div>':'')+
      (weaknesses?'<div class="sec"><div class="sec-title">Weaknesses <span class="ct">'+p.weaknesses.length+'</span></div>'+weaknesses+'</div>':'')+
      (demo?'<div class="sec"><div class="sec-title">Demo plan</div>'+demo+'</div>':'')+
      (p.panelNotes?'<div class="sec"><div class="sec-title">Review panel &middot; verdict</div><div class="panel-note">'+esc(p.panelNotes)+'</div></div>':'')+
      (p.caveats?'<div class="sec"><div class="sec-title">Caveats</div><div class="caveat"><div class="cv-l">&#9888; Read before sending</div>'+esc(p.caveats)+'</div></div>':'')+
      (todos?'<div class="sec"><div class="sec-title">Operator to-do <span class="ct">'+p.operatorTodo.length+'</span></div>'+todos+'</div>':'')+
      ((c.name||c.email)?'<div class="sec"><div class="sec-title">Contact</div><div class="contact-card"><div class="avatar">'+esc(initials(c.name))+'</div><div style="flex:1;min-width:0"><div class="ct-name">'+esc(c.name||'—')+'</div><div class="ct-role">'+esc(c.title||'')+'</div><div class="ct-email">'+(c.email?esc(c.email):'email needed')+'</div><div style="margin-top:6px">'+emailBadge(c)+'</div></div><div class="ct-links">'+(c.email?'<button class="mini" data-copyemailaddr="'+esc(c.email)+'">Copy</button>':'')+(c.linkedin?'<a class="mini" href="'+esc(c.linkedin)+'" target="_blank" rel="noopener" style="text-decoration:none">LinkedIn ↗</a>':'')+'</div></div></div>':'')+
      ((p.drafts&&p.drafts.length)?'<div class="sec"><div class="sec-title">Cold email drafts <span class="ct">'+p.drafts.length+'</span></div>'+drafts+'</div>':'')+
    '</div>';

  $('#drClose').addEventListener('click', closeDrawer);
  $$('[data-copysubj]',dr).forEach(function(b){ b.addEventListener('click',function(){ var d=p.drafts[+b.getAttribute('data-copysubj')]; if(d) copy(d.subject||'', 'Subject copied'); }); });
  $$('[data-copymail]',dr).forEach(function(b){ b.addEventListener('click',function(){ var d=p.drafts[+b.getAttribute('data-copymail')]; if(d) copy((d.subject?d.subject+'\n\n':'')+(d.body||''), 'Email copied'); }); });
  $$('[data-copyemailaddr]',dr).forEach(function(b){ b.addEventListener('click',function(){ copy(b.getAttribute('data-copyemailaddr'), 'Email address copied'); }); });

  $('#overlay').classList.add('show');
  dr.classList.add('show'); dr.setAttribute('aria-hidden','false');
  dr.scrollTop=0;
  var fc=$('#drClose'); if(fc) fc.focus();
  document.body.style.overflow='hidden';
}
function closeDrawer(){ $('#drawer').classList.remove('show'); $('#drawer').setAttribute('aria-hidden','true'); $('#overlay').classList.remove('show'); document.body.style.overflow=''; }

/* ---------- utilities ---------- */
var toastT;
function toast(msg){ var t=$('#toast'); $('#toastMsg').textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('show'); },1800); }
function copy(text,msg){
  function done(ok){ toast(ok?(msg||'Copied'):'Copy failed'); }
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){done(true);}).catch(function(){done(false);}); }
  else { try{ var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done(true); }catch(e){ done(false); } }
}
function setLive(kind, ts){
  var d=$('#liveDot'), t=$('#liveTxt');
  d.className='live-dot'+(kind==='live'?'':kind==='error'?' is-err':' is-seed');
  t.textContent = kind==='live' ? ('Live · '+(ts||now())) : kind==='error' ? 'Offline' : 'Loading…';
}
function now(){ try{ return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
function fmt(iso){ try{ return new Date(iso).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }catch(e){ return now(); } }

/* ---------- data load ---------- */
function load(){
  if(!RAW.length){ STATE='loading'; render(); setLive('seed'); }
  var btn=$('#refreshBtn'); if(btn) btn.disabled=true;
  fetch(API, {cache:'no-store'}).then(function(res){
    if(!res.ok) throw new Error('HTTP '+res.status);
    return res.json();
  }).then(function(j){
    var list = j.prospects || j.data || [];
    if(!Array.isArray(list)) throw new Error('bad payload');
    RAW = list.map(norm);
    STATE = RAW.length ? 'ready' : 'empty';
    render();
    setLive('live', j.generatedAt ? fmt(j.generatedAt) : now());
  }).catch(function(err){
    if(!RAW.length){ STATE='error'; render(); }
    setLive('error');
    if(window.console) console.warn('[prospect-command] load failed:', err && err.message);
  }).then(function(){ if(btn) btn.disabled=false; });
}

/* ---------- events ---------- */
$('#search').addEventListener('input', function(e){ search=e.target.value.trim(); if(STATE==='ready') renderTable(); });
$('#refreshBtn').addEventListener('click', load);
$('#overlay').addEventListener('click', closeDrawer);
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeDrawer(); });
$('#chips').addEventListener('click', function(e){ var c=e.target.closest('[data-chip]'); if(!c) return; filter=c.getAttribute('data-chip'); renderChips(); renderTable(); });
$$('.sortbtn').forEach(function(b){ b.addEventListener('click', function(){ var k=b.getAttribute('data-sort'); if(sortKey===k){ sortDir=-sortDir; } else { sortKey=k; sortDir=(k==='store')?1:-1; } syncSortUI(); renderTable(); }); });
$$('thead th.sortable').forEach(function(th){ th.addEventListener('click', function(){ var k=th.getAttribute('data-sort'); if(sortKey===k){ sortDir=-sortDir; } else { sortKey=k; sortDir=(k==='store')?1:-1; } syncSortUI(); renderTable(); }); });
$('#tbody').addEventListener('click', function(e){ var tr=e.target.closest('tr[data-i]'); if(!tr) return; var p=RAW[+tr.getAttribute('data-i')]; if(p) openDrawer(p); });
$('#tbody').addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ var tr=e.target.closest('tr[data-i]'); if(tr){ e.preventDefault(); var p=RAW[+tr.getAttribute('data-i')]; if(p) openDrawer(p); } } });

/* boot */
render();
load();
</script>
</body>
</html>
