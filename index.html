<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KONARSTUDIO — client research</title>
  <meta name="robots" content="noindex, nofollow">
  <script>try{var t=localStorage.getItem('site-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">
      <svg class="brand-mark" width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <rect width="28" height="28" rx="8" fill="#2563eb"/>
        <path d="M9.5 7.5V20.5M9.5 14L18 7.5M9.5 14L18 20.5" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-text">
        <span class="brand-name">KONAR<span class="brand-thin">STUDIO</span></span>
        <small>client research</small>
      </span>
    </span>
    <span class="spacer"></span>
    <a class="btn" href="#stats">Analytics</a>
    <a class="btn" href="#insights">Insights</a>
    <a class="btn" href="#">Latest</a>
    <button id="theme-toggle" aria-label="Toggle theme">◐</button>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="search-wrap">
        <input id="search" type="search" placeholder="Filter by brand, weakness, contact…" aria-label="Filter prospects">
      </div>
      <nav id="nav"></nav>
    </aside>
    <main id="content"><div class="wrap"><div class="loading">Loading…</div></div></main>
  </div>
  <script src="assets/app.js"></script>
</body>
</html>
